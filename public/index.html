<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>interFace / interSignal</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body data-view="signals">
  <main id="signal-guessing">
    <nav class="app-tabs" aria-label="화면 선택">
      <button class="app-tab is-active" type="button" data-view-button="signals" aria-selected="true">신호</button>
      <button class="app-tab" type="button" data-view-button="record" aria-selected="false">녹화</button>
      <button class="app-tab" type="button" data-view-button="playback" aria-selected="false">재생</button>
    </nav>
    <nav class="panel-toggles" aria-label="표시할 신호 카드">
      <label class="panel-toggle" aria-label="신호 카드 01 표시 전환">
        <input type="checkbox" data-card-id="contact" checked />
        <span>01</span>
      </label>
      <label class="panel-toggle" aria-label="신호 카드 02 표시 전환">
        <input type="checkbox" data-card-id="raw" />
        <span>02</span>
      </label>
      <label class="panel-toggle" aria-label="신호 카드 03 표시 전환">
        <input type="checkbox" data-card-id="bands" />
        <span>03</span>
      </label>
      <label class="panel-toggle" aria-label="신호 카드 04 표시 전환">
        <input type="checkbox" data-card-id="esense" />
        <span>04</span>
      </label>
      <label class="panel-toggle" aria-label="신호 카드 05 표시 전환">
        <input type="checkbox" data-card-id="movement" />
        <span>05</span>
      </label>
      <label class="panel-toggle" aria-label="신호 카드 06 표시 전환">
        <input type="checkbox" data-card-id="eyes" />
        <span>06</span>
      </label>
    </nav>

    <section id="recording-view" class="recording-view" hidden>
      <div class="camera-panel">
        <span class="record-card-number">03</span>
        <div class="camera-frame">
          <video id="camera-preview" autoplay muted playsinline></video>
          <div id="camera-placeholder" class="camera-placeholder">카메라 꺼짐</div>
        </div>
        <canvas id="camera-capture" class="capture-canvas" width="134" height="100"></canvas>
        <button id="enable-camera" class="tool-button" type="button">카메라 켜기</button>
        <dl class="camera-specs">
          <div><dt>해상도</dt><dd>134 x 100</dd></div>
          <div><dt>프레임</dt><dd>8 FPS</dd></div>
          <div><dt>영상</dt><dd>50 kbps</dd></div>
        </dl>
      </div>

      <div class="record-controls">
        <span class="record-card-number">04</span>
        <div class="record-actions">
          <button id="choose-folder" class="tool-button" type="button">저장 폴더 선택</button>
          <button id="start-recording-30" class="tool-button record-button" type="button" disabled>
            <span class="record-dot" aria-hidden="true"></span>30초 녹화
          </button>
          <button id="start-recording-60" class="tool-button record-button" type="button" disabled>
            <span class="record-dot" aria-hidden="true"></span>1분 녹화
          </button>
          <button id="stop-recording" class="tool-button" type="button" disabled>녹화 중지</button>
        </div>

        <dl class="record-status-grid">
          <div><dt>상태</dt><dd id="record-state">대기</dd></div>
          <div><dt>남은 시간</dt><dd id="record-elapsed">--:--</dd></div>
          <div><dt>패킷</dt><dd id="record-packets">0</dd></div>
          <div><dt>RAW 샘플</dt><dd id="record-raw">0</dd></div>
        </dl>

        <div class="record-destination">
          <span>저장 위치</span>
          <output id="record-folder">선택되지 않음</output>
        </div>
        <p id="record-message" class="record-message" role="status" aria-live="polite">TGAM을 연결하고 저장 폴더를 선택해 주세요. 카메라는 선택 사항입니다.</p>
      </div>

      <div class="record-files">
        <div class="record-file"><span>세션 ZIP</span><output id="archive-file">--</output></div>
      </div>
    </section>

    <section id="playback-view" class="playback-view" hidden>
      <header class="playback-toolbar">
        <div class="playback-actions">
          <div class="playback-load-action">
            <button id="add-playback" class="playback-button" type="button">녹화 파일 불러오기</button>
            <span class="playback-load-help">ZIP 파일 올려주세요</span>
          </div>
          <button id="play-all" class="playback-button" type="button" disabled>재생</button>
          <button id="pause-playback" class="playback-button" type="button" disabled>일시정지</button>
          <button id="restart-playback" class="playback-button" type="button" disabled>처음부터</button>
          <button id="clear-playback" class="playback-button" type="button" disabled>모두 지우기</button>
        </div>
        <div class="playback-card-options" role="group" aria-label="추가 신호 카드">
          <button class="playback-card-option is-active" type="button" data-playback-card="bands" aria-pressed="true" title="03 절대 밴드 파워">03</button>
          <button class="playback-card-option" type="button" data-playback-card="esense" aria-pressed="false" title="04 집중도 / 명상도">04</button>
          <button class="playback-card-option" type="button" data-playback-card="movement" aria-pressed="false" title="05 움직임">05</button>
          <button class="playback-card-option" type="button" data-playback-card="eyes" aria-pressed="false" title="06 눈 감음">06</button>
        </div>
        <output id="playback-count" class="playback-count">0 / 3</output>
        <input id="playback-files" type="file" accept=".zip,.txt,.ndjson,.webm,application/zip,video/webm,application/x-ndjson" multiple hidden />
      </header>
      <p id="playback-message" class="playback-message" role="status" aria-live="polite">불러온 녹화가 없습니다.</p>
      <div id="playback-empty" class="playback-empty">녹화 없음</div>
      <div id="playback-list" class="playback-list"></div>
    </section>
  </main>
  <script src="./tgam-parser.js"></script>
  <script src="./derived-signals.js"></script>
  <script src="./serial-source.js"></script>
  <script src="./tabs.js"></script>
  <script src="./recorder-core.js"></script>
  <script src="./session-zip.js"></script>
  <script src="./recorder.js"></script>
  <script src="./playback-core.js"></script>
  <script src="./playback.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
