<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>interFace / interSignal</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <main id="signal-guessing">
    <nav class="panel-toggles" aria-label="Visible signal cards">
      <label class="panel-toggle" aria-label="Toggle signal card 01">
        <input type="checkbox" data-card-id="contact" checked />
        <span>01</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 02">
        <input type="checkbox" data-card-id="movement" checked />
        <span>02</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 03">
        <input type="checkbox" data-card-id="eyes" checked />
        <span>03</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 04">
        <input type="checkbox" data-card-id="raw" checked />
        <span>04</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 05">
        <input type="checkbox" data-card-id="bands" checked />
        <span>05</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 06">
        <input type="checkbox" data-card-id="esense" checked />
        <span>06</span>
      </label>
    </nav>
  </main>
  <script src="./tgam-parser.js"></script>
  <script src="./derived-signals.js"></script>
  <script src="./serial-source.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
