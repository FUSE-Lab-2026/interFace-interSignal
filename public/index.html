<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>interFace / interSignal</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body data-view="signals">
  <main id="signal-guessing">
    <nav class="app-tabs" aria-label="Application views">
      <button class="app-tab is-active" type="button" data-view-button="signals" aria-selected="true">Signals</button>
      <button class="app-tab" type="button" data-view-button="record" aria-selected="false">Record</button>
    </nav>
    <nav class="panel-toggles" aria-label="Visible signal cards">
      <label class="panel-toggle" aria-label="Toggle signal card 01">
        <input type="checkbox" data-card-id="contact" checked />
        <span>01</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 02">
        <input type="checkbox" data-card-id="movement" checked />
        <span>02</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 03">
        <input type="checkbox" data-card-id="eyes" checked />
        <span>03</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 04">
        <input type="checkbox" data-card-id="raw" checked />
        <span>04</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 05">
        <input type="checkbox" data-card-id="bands" checked />
        <span>05</span>
      </label>
      <label class="panel-toggle" aria-label="Toggle signal card 06">
        <input type="checkbox" data-card-id="esense" checked />
        <span>06</span>
      </label>
    </nav>

    <section id="recording-view" class="recording-view" hidden>
      <div class="camera-panel">
        <span class="record-card-number">02</span>
        <div class="camera-frame">
          <video id="camera-preview" autoplay muted playsinline></video>
          <div id="camera-placeholder" class="camera-placeholder">CAMERA OFF</div>
        </div>
        <canvas id="camera-capture" class="capture-canvas" width="134" height="100"></canvas>
        <button id="enable-camera" class="tool-button" type="button">Enable Camera</button>
        <dl class="camera-specs">
          <div><dt>FRAME</dt><dd>134 x 100</dd></div>
          <div><dt>RATE</dt><dd>8 FPS</dd></div>
          <div><dt>VIDEO</dt><dd>50 kbps</dd></div>
          <div><dt>AUDIO</dt><dd>OFF</dd></div>
        </dl>
      </div>

      <div class="record-controls">
        <span class="record-card-number">03</span>
        <div class="record-actions">
          <button id="choose-folder" class="tool-button" type="button">Choose Folder</button>
          <button id="start-recording-30" class="tool-button record-button" type="button" disabled>
            <span class="record-dot" aria-hidden="true"></span>30 s
          </button>
          <button id="start-recording-60" class="tool-button record-button" type="button" disabled>
            <span class="record-dot" aria-hidden="true"></span>1 min
          </button>
          <button id="stop-recording" class="tool-button" type="button" disabled>Stop</button>
        </div>

        <dl class="record-status-grid">
          <div><dt>SESSION</dt><dd id="record-state">IDLE</dd></div>
          <div><dt>LEFT</dt><dd id="record-elapsed">--:--</dd></div>
          <div><dt>PACKETS</dt><dd id="record-packets">0</dd></div>
          <div><dt>RAW</dt><dd id="record-raw">0</dd></div>
        </dl>

        <div class="record-destination">
          <span>DESTINATION</span>
          <output id="record-folder">NOT SELECTED</output>
        </div>
        <p id="record-message" class="record-message" role="status" aria-live="polite">Connect TGAM, choose a folder, and enable the camera.</p>
      </div>

      <div class="record-files">
        <div class="record-file"><span>PACKETS</span><output id="packets-file">--</output></div>
        <div class="record-file"><span>RAW EEG</span><output id="raw-file">--</output></div>
        <div class="record-file"><span>CAMERA</span><output id="video-file">--</output></div>
        <div class="record-file"><span>MANIFEST</span><output id="manifest-file">--</output></div>
      </div>
    </section>
  </main>
  <script src="./tgam-parser.js"></script>
  <script src="./derived-signals.js"></script>
  <script src="./serial-source.js"></script>
  <script src="./tabs.js"></script>
  <script src="./recorder-core.js"></script>
  <script src="./recorder.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
